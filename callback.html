<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign-in code</title>
<style>body{font-family:system-ui,Segoe UI,Arial,sans-serif;max-width:720px;margin:40px auto;padding:0 16px;line-height:1.6;color:#222;background:#fff}textarea{width:100%;height:110px;font-size:14px}button{font-size:16px;padding:8px 16px}</style></head>
<body><h1>YourMoneyMathCoach Uploader</h1><p id="msg">Copy the full address below and paste it into the uploader.</p>
<textarea id="u" readonly></textarea><p><button onclick="navigator.clipboard.writeText(document.getElementById('u').value);this.textContent='Copied'">Copy</button></p>
<script>var q=new URLSearchParams(location.search);document.getElementById('u').value=location.href;
if(q.get('error')){document.getElementById('msg').textContent='TikTok returned an error: '+q.get('error')+' '+(q.get('error_description')||'');}</script></body></html>
